[build-system]
requires = ["setuptools>=84.1", "wheel", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "yolox"
version = "0.3.0"
description = "YOLOX object detection training and inference"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{name = "Megvii BaseDetection team"}]
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    "opencv-python>=4.10,<5",
    "loguru>=0.7,<1",
    "tqdm>=4.66,<5",
    "thop>=0.1.1",
    "ninja>=1.11,<2",
    "tabulate>=0.9,<1",
    "psutil>=5.9,<8",
    "tensorboard>=2.18,<3",
    "packaging>=24",
    "pycocotools>=2.0.8,<3",
]

[project.urls]
Documentation = "https://yolox.readthedocs.io"
Source = "https://github.com/markosnarinian/YOLOX"

[project.optional-dependencies]
export = ["onnx>=1.17,<2", "onnxsim>=0.4.36,<1", "onnxruntime>=1.20,<2"]
mlflow = ["mlflow>=2.20,<4", "python-dotenv>=1,<2"]
wandb = ["wandb>=0.19,<1"]
cpu = ["torch>=2.13,<3", "torchvision>=0.28,<1"]
cuda = ["torch>=2.13,<3; sys_platform != 'darwin'", "torchvision>=0.28,<1; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.11,<1", "pip-audit>=2.9,<3", "setuptools>=84.1"]
docs = ["sphinx>=8,<9", "myst-parser>=4,<5", "sphinx-rtd-theme>=3,<4", "sphinx-markdown-tables>=0.0.17"]

[tool.setuptools]
include-package-data = true

[tool.uv]
default-groups = ["dev"]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu"},
    {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'"},
]
torchvision = [
    {index = "pytorch-cpu", extra = "cpu"},
    {index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
