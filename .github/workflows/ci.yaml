name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra export
      - run: uv run --no-sync ruff check yolox tools tests setup.py
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Install and test the wheel outside the checkout
        shell: bash
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -c "from yolox.models import yolox_nano; import torch; m=yolox_nano(pretrained=False, device='cpu').eval(); assert m(torch.zeros(1,3,64,64)).shape == (1,84,85)"
        if: runner.os != 'Windows'
      - name: Installed wheel on Windows
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --reinstall --no-deps $wheel
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE/.venv/Scripts/python.exe" -I -c "from yolox.models import yolox_nano; import torch; m=yolox_nano(pretrained=False, device='cpu').eval(); assert m(torch.zeros(1,3,64,64)).shape == (1,84,85)"
        if: runner.os == 'Windows'

  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra export
      - run: uv pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
      - run: uv pip install numpy==1.26.4
      - run: uv run --no-sync pytest -q

  openvino-native:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build libopencv-dev
      - run: uv sync --locked --extra cpu --extra export
      - name: Download verified native SDK and model
        run: |
          curl -fL https://storage.openvinotoolkit.org/repositories/openvino/packages/2025.4.1/linux/openvino_toolkit_ubuntu22_2025.4.1.20426.82bbf0292c5_x86_64.tgz -o /tmp/openvino.tgz
          echo '4e9501655a30e93ebdd1c21944c16eb094012cc541653f8151ed981061466d84  /tmp/openvino.tgz' | sha256sum -c -
          tar xzf /tmp/openvino.tgz -C /tmp
          curl -fL https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.pth -o /tmp/nano.pth
          echo 'cd28f55fbbc1829f99d9ac9b38a16d259a22889739c8728ea877610201feff7b  /tmp/nano.pth' | sha256sum -c -
          uv run --no-sync python tools/export_onnx.py -n yolox-nano -c /tmp/nano.pth --output-name /tmp/nano.onnx
      - name: Build and exercise native CPU inference
        run: |
          cmake -S demo/OpenVINO/cpp -B /tmp/openvino-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOpenVINO_DIR=/tmp/openvino_toolkit_ubuntu22_2025.4.1.20426.82bbf0292c5_x86_64/runtime/cmake
          cmake --build /tmp/openvino-build --parallel 2
          /tmp/openvino-build/yolox_openvino /tmp/nano.onnx assets/dog.jpg CPU 2> /tmp/openvino-inference.log
          cat /tmp/openvino-inference.log
          grep -E '^16 = ' /tmp/openvino-inference.log
          test -s _demo.jpg
          if /tmp/openvino-build/yolox_openvino /tmp/nano.onnx /tmp/missing-image.jpg CPU; then
            echo 'Unreadable image must fail'
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --group docs
      - run: uv run --no-sync sphinx-build -b html docs /tmp/yolox-docs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.9"
          python-version: "3.12"
      - run: uv sync --locked --extra cpu --extra export
      - run: uv run --no-sync pip-audit --path .venv/lib/python3.12/site-packages
      - name: Audit PyTorch versions without wheel-local CUDA/CPU suffixes
        run: |
          uv run --no-sync python - <<'PY' > /tmp/torch-versions.txt
          from importlib.metadata import version
          for name in ("torch", "torchvision"):
              print("{}=={}".format(name, version(name).partition("+")[0]))
          PY
          uv run --no-sync pip-audit --no-deps --disable-pip -r /tmp/torch-versions.txt
