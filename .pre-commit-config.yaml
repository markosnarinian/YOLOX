repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff correctness checks
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-merge-conflict
